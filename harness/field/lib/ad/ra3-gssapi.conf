# ad-trust (SB.ad-spnego): the SPNEGO target for the DC. Every URL needs a Kerberos login.
# REMOTE_USER is the full principal (GssapiLocalName is off by default); %u logs it.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{User-Agent}i\"" ra3
CustomLog "logs/ra3_access.log" ra3
<Location "/">
    AuthType GSSAPI
    AuthName "RA3 SPNEGO"
    GssapiCredStore keytab:/etc/httpd/http.keytab
    GssapiAllowedMech krb5
    Require valid-user
</Location>
