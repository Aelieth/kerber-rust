# SHA-2-only MIT 1.22.2 client profile for sha2-gate.
# Forces aes256-cts-hmac-sha384-192 (RFC 8009 etype 20) for AS and TGS.
[libdefaults]
    default_realm = KERBER.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    dns_canonicalize_hostname = false
    ticket_lifetime = 10h
    forwardable = true
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}
    permitted_enctypes = aes256-cts-hmac-sha384-192
    default_tgs_enctypes = aes256-cts-hmac-sha384-192
    default_tkt_enctypes = aes256-cts-hmac-sha384-192
    allow_weak_crypto = false

[realms]
    KERBER.TEST = {
        kdc = 127.0.0.1
        admin_server = 127.0.0.1
    }

[domain_realm]
    .kerber.test = KERBER.TEST
    kerber.test = KERBER.TEST

[logging]
    default = STDERR
    kdc = STDERR
    admin_server = STDERR
