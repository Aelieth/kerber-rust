[libdefaults]
    default_realm = KERBER.TEST
    default_etypes = aes256-cts-hmac-sha1-96
    default_etypes_des = aes256-cts-hmac-sha1-96
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    dns_canonicalize_hostname = false
    ticket_lifetime = 10h
    forwardable = true
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}

[realms]
    KERBER.TEST = {
        kdc = 127.0.0.1
        admin_server = 127.0.0.1
    }

[domain_realm]
    .kerber.test = KERBER.TEST
    kerber.test = KERBER.TEST

[kadmin]
    default_keys = aes256-cts-hmac-sha1-96:pw-salt

[logging]
    kdc = FILE:/var/log/heimdal-kdc.log
    default = FILE:/var/log/heimdal-kdc.log
