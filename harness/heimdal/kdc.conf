[kdc]
    ports = 88
    require-preauth = yes
    check-ticket-addresses = false
    allow-null-ticket-addresses = true
    database = {
        dbname = /var/lib/heimdal-kdc/heimdal
        realm = KERBER.TEST
        mkey_file = /var/lib/heimdal-kdc/m-key
        acl_file = /etc/heimdal-kdc/kadmind.acl
    }

[kadmin]
    default_keys = aes256-cts-hmac-sha1-96:pw-salt

[libdefaults]
    default_realm = KERBER.TEST
    default_etypes = aes256-cts-hmac-sha1-96

[logging]
    kdc = FILE:/var/log/heimdal-kdc.log
    default = FILE:/var/log/heimdal-kdc.log
