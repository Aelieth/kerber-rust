[package]
name = "krb5-client"
description = "Minimal Kerberos V5 client: kinit, FILE ccache, keytab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "krb5-kinit"
path = "src/bin/krb5-kinit.rs"

[[bin]]
name = "krb5-klist"
path = "src/bin/krb5-klist.rs"

[[bin]]
name = "krb5-kdestroy"
path = "src/bin/krb5-kdestroy.rs"

[[bin]]
name = "krb5-kvno"
path = "src/bin/krb5-kvno.rs"

[[bin]]
name = "krb5-kswitch"
path = "src/bin/krb5-kswitch.rs"

[dependencies]
chrono.workspace = true
krb5-asn1.workspace = true
krb5-cli.workspace = true
krb5-config.workspace = true
krb5-crypto.workspace = true
krb5-log.workspace = true
krb5-protocol.workspace = true
krb5-types.workspace = true
nix = { workspace = true, features = ["hostname"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
zeroize.workspace = true

[features]
# The gates' inputs, off by default and never in a release build: kinit's --spake, --fast,
# --armor-ccache, --pkinit and --pkinit-anchors, its positional [kdc-host] principal [ccache
# [service]], -S as a TGS-REQ after the TGT, and its log lines on stdout; kvno's
# --disable-transited-check, --body-realm, --renew and --renew-ticket, a KDC host before the
# services, and S4U2Self for a service other than the cache's own; and, through
# krb5-config/test-hooks, KRB5_PASSWORD and KRB5_NEW_PASSWORD (docs/testing.md lists them).
test-hooks = ["dep:tracing-subscriber", "krb5-config/test-hooks", "krb5-protocol/test-hooks"]

[lints]
workspace = true

[dev-dependencies]
krb5-kdc.workspace = true
krb5-testkit.workspace = true
