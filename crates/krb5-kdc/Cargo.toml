[package]
name = "krb5-kdc"
description = "Pure-Rust Kerberos V5 KDC: AS/TGS issue, PKINIT/SPAKE/FAST preauth, PAC/S4U, dump-v7 KDB, ACL admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "krb5-kdc"
path = "src/bin/krb5-kdc.rs"
required-features = ["daemon"]

[[bin]]
name = "krb5-kdb"
path = "src/bin/krb5-kdb.rs"

[dependencies]
getrandom.workspace = true
krb5-asn1.workspace = true
krb5-cli.workspace = true
krb5-config.workspace = true
krb5-crypto.workspace = true
krb5-log.workspace = true
krb5-protocol.workspace = true
krb5-types.workspace = true
nix = { workspace = true, features = ["fs", "poll", "process"] }
sha2.workspace = true
signal-hook.workspace = true
subtle.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
krb5-testkit.workspace = true

[features]
default = ["daemon"]
# The serve loops, signal handlers, pid-file, detach and the
# tracing-subscriber dep; a release build and the bins carry it, an embedder opts out with
# --no-default-features.
daemon = ["dep:tracing-subscriber"]

# The gate and test hooks (test realms, KRB5_TEST_* seeding, key export) belong behind
# this feature, off by default, so that a release build carries none of them. It turns on
# krb5-config's and krb5-protocol's too, for every binary built beside the KDC.
test-hooks = ["krb5-config/test-hooks", "krb5-crypto/test-hooks", "krb5-protocol/test-hooks", "krb5-types/test-ca", "krb5-testkit/test-hooks"]

[lints]
workspace = true

[[test]]
name = "acl"
required-features = ["test-hooks"]

[[test]]
name = "ap_req"
required-features = ["test-hooks"]

[[test]]
name = "as_anonymous"
