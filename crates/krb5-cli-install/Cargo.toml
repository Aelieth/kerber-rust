[package]
name = "krb5-cli-install"
description = "Installs the krb5-kinit and krb5-kadmind stderr printers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ctor = "0.4"
krb5-cli-print = { path = "../krb5-cli-print" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "deny"
unimplemented = "deny"
no_effect_underscore_binding = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
many_single_char_names = "allow"
