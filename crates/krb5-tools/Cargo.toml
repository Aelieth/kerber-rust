[package]
name = "krb5-tools"
description = "Harness-only Kerberos tools for the gates. Not a product surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
krb5-admin.workspace = true
krb5-asn1.workspace = true
krb5-client.workspace = true
krb5-config.workspace = true
getrandom.workspace = true
krb5-crypto.workspace = true
krb5-kdc.workspace = true
krb5-protocol = { workspace = true, features = ["diff"] }
krb5-types.workspace = true
sha1.workspace = true

# The gates' tools are built only beside the KDC's test hooks (`--features krb5-kdc/test-hooks`,
# as scripts/lib/build-bins.sh builds them), so a release build has none of them, nor the
# environment they read.
[[bin]]
name = "ccache-probe"
path = "src/bin/ccache-probe.rs"
required-features = ["krb5-kdc/test-hooks"]

[[bin]]
name = "diffsend"
path = "src/bin/diffsend.rs"
required-features = ["krb5-kdc/test-hooks"]

[[bin]]
name = "kprop-expired-apreq"
path = "src/bin/kprop-expired-apreq.rs"
required-features = ["krb5-kdc/test-hooks"]

[[bin]]
name = "krb5-forge-tgt"
path = "src/bin/krb5-forge-tgt.rs"
required-features = ["krb5-kdc/test-hooks"]

[[bin]]
name = "krb5-pac-extract"
path = "src/bin/krb5-pac-extract.rs"
required-features = ["krb5-kdc/test-hooks"]

[[bin]]
name = "krb5-vfy-increds"
path = "src/bin/krb5-vfy-increds.rs"
required-features = ["krb5-kdc/test-hooks"]

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"
required-features = ["krb5-kdc/test-hooks"]

# It runs krb5-forge-tgt, so it needs that program built.
[[test]]
name = "forge_tgt"
path = "tests/forge_tgt.rs"
required-features = ["krb5-kdc/test-hooks"]

[lints]
workspace = true
