path = "tests/l3b_fast_avail.rs"

[[test]]
name = "r0a_spake_padata"
path = "tests/r0a_spake_padata.rs"

[[test]]
name = "r10_edata_oracle"
path = "tests/r10_edata_oracle.rs"
required-features = ["diff"]

[[test]]
name = "b1_fast_nonce"
path = "tests/b1_fast_nonce.rs"

[[test]]
name = "b1_timesync"
path = "tests/b1_timesync.rs"

