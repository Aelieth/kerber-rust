[package]
name = "krb5-protocol"
description = "Kerberos V5 AS/TGS/AP/SAFE/PRIV exchanges, preauth padata, keytab and ccaches over UDP/TCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[features]
default = ["diff"]
diff = []

[[example]]
name = "diffsend"
required-features = ["diff"]

[[test]]
name = "golden_traces"
path = "tests/golden_traces.rs"

[[test]]
name = "messages"
path = "tests/messages.rs"

[[test]]
name = "safe_priv"
path = "tests/safe_priv.rs"

[[test]]
name = "client_verify_as"
path = "tests/client_verify_as.rs"

[[test]]
name = "client_fast"
path = "tests/client_fast.rs"

[[test]]
name = "client_preauth_order"
path = "tests/client_preauth_order.rs"

[[test]]
name = "client_gic"
path = "tests/client_gic.rs"

[[test]]
name = "client_vfy_increds"
path = "tests/client_vfy_increds.rs"

[[test]]
name = "client_tgs_reply"
path = "tests/client_tgs_reply.rs"

[[test]]
name = "client_s4u"
path = "tests/client_s4u.rs"

[[test]]
name = "acceptor_rd_req"
path = "tests/acceptor_rd_req.rs"

[[test]]
name = "acceptor_sname"
path = "tests/acceptor_sname.rs"

[dependencies]
getrandom.workspace = true
krb5-asn1.workspace = true
krb5-config.workspace = true
krb5-crypto.workspace = true
krb5-log.workspace = true
krb5-types.workspace = true
nix = { workspace = true, features = ["fs"] }
sha1.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
krb5-kdc.workspace = true
krb5-testkit.workspace = true

[lints]
workspace = true
