[package]
name = "krb5-protocol"
description = "Kerberos V5 AS/TGS exchanges over UDP/TCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[features]
default = ["diff"]
diff = []

[[example]]
name = "diffsend"
required-features = ["diff"]

[[test]]
name = "golden_traces"
path = "tests/golden_traces.rs"

[[test]]
name = "messages"
path = "tests/messages.rs"

[[test]]
