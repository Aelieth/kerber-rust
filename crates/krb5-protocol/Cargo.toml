[package]
name = "krb5-protocol"
description = "Kerberos V5 AS/TGS/AP/SAFE/PRIV exchanges, preauth padata, keytab and ccaches over UDP/TCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[features]
default = []
diff = []
# The gates' raw PDU capture (`KERBER_CAPTURE_DIR`); off by default.
test-hooks = ["test-ca", "krb5-kdc/test-hooks", "krb5-testkit/test-hooks"]
# PA-PK-AS-REQ builders signed under the generated test CA: test builds only.
test-ca = ["krb5-types/test-ca"]

[[test]]
name = "golden_traces"
required-features = ["test-hooks"]
path = "tests/golden_traces.rs"

[[test]]
name = "messages"
required-features = ["test-hooks"]
path = "tests/messages.rs"

[[test]]
name = "safe_priv"
path = "tests/safe_priv.rs"

[[test]]
name = "client_verify_as"
required-features = ["test-hooks"]
path = "tests/client_verify_as.rs"

[[test]]
name = "client_fast"
required-features = ["test-hooks"]
path = "tests/client_fast.rs"

[[test]]
name = "client_preauth_order"
required-features = ["test-hooks"]
path = "tests/client_preauth_order.rs"

[[test]]
name = "clpreauth_plugins"
path = "tests/clpreauth_plugins.rs"

[[test]]
name = "client_spake"
required-features = ["test-hooks"]
path = "tests/client_spake.rs"

[[test]]
name = "client_otp"
required-features = ["test-hooks"]
path = "tests/client_otp.rs"

[[test]]
name = "client_password_per_mechanism"
required-features = ["test-hooks"]
path = "tests/client_password_per_mechanism.rs"

[[test]]
name = "client_gic"
path = "tests/client_gic.rs"

[[test]]
name = "client_vfy_increds"
required-features = ["test-hooks"]
path = "tests/client_vfy_increds.rs"

[[test]]
name = "client_s4u"
required-features = ["test-hooks"]
path = "tests/client_s4u.rs"

[[test]]
name = "des3_subkeys"
required-features = ["test-hooks"]
path = "tests/des3_subkeys.rs"

[[test]]
name = "acceptor_rd_req"
required-features = ["test-hooks"]
path = "tests/acceptor_rd_req.rs"

[dependencies]
bytes.workspace = true
getrandom.workspace = true
krb5-asn1.workspace = true
krb5-config.workspace = true
krb5-crypto.workspace = true
krb5-log.workspace = true
krb5-types.workspace = true
nix = { workspace = true, features = ["fs", "time"] }
sha1.workspace = true
thiserror.workspace = true
tracing.workspace = true
subtle.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
regex-automata.workspace = true
rustix.workspace = true

[dev-dependencies]
krb5-kdc.workspace = true
krb5-testkit.workspace = true

[lints]
workspace = true
