[package]
name = "krb5-protocol"
description = "Kerberos V5 AS/TGS exchanges over UDP/TCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[features]
default = ["diff"]
diff = []

[[example]]
name = "diffsend"
required-features = ["diff"]

[[test]]
name = "golden_traces"
path = "tests/golden_traces.rs"

[[test]]
name = "messages"
path = "tests/messages.rs"

[[test]]
name = "safe_noncanon"
path = "tests/safe_noncanon.rs"

[[test]]
name = "l3b_fast_nego"
path = "tests/l3b_fast_nego.rs"

[[test]]
name = "l3b_fast_avail"
path = "tests/l3b_fast_avail.rs"

[[test]]
name = "r0a_spake_padata"
path = "tests/r0a_spake_padata.rs"

[[test]]
name = "r10_edata_oracle"
path = "tests/r10_edata_oracle.rs"
required-features = ["diff"]

[dependencies]
chrono.workspace = true
getrandom.workspace = true
krb5-asn1.workspace = true
krb5-config.workspace = true
krb5-crypto.workspace = true
krb5-log.workspace = true
krb5-types.workspace = true
nix = { workspace = true, features = ["fs"] }
sha1.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
krb5-kdc.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
