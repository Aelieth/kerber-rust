# Keeps the SHA pins in .github/workflows and .github/actions current (the tag
# comment on each `uses:` is what dependabot rewrites) and the cargo tree
# reviewed weekly. ci-policy.py check_workflow_hardening asserts both ecosystems.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Dependabot rebases fail on every main move and sit in the
    # nightly median-of-5 window. Pause new cargo PRs through W3.
    open-pull-requests-limit: 0
