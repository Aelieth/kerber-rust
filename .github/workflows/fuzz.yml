name: fuzz

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/krb5-asn1/**"
      - "crates/krb5-types/**"
      - "crates/krb5-crypto/**"
      - "crates/krb5-protocol/**"
      - "crates/krb5-gss/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - der_decode
          - as_tgs_ap
          - keytab_ccache
          - pkinit_cms
          - pac_ndr
          - spake_point
          - oakley_dh
          - gss_token
          - transited
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: seed corpus from traces
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          case "${{ matrix.target }}" in
            der_decode|as_tgs_ap) cp tests/traces/mit-*.der fuzz/corpus/${{ matrix.target }}/ || true ;;
          esac
      - name: smoke ${{ matrix.target }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60 -rss_limit_mb=2048
