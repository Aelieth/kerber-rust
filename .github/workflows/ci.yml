name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: test --release
        run: cargo test --workspace --release
      - name: doc
        run: cargo doc --workspace --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: MSRV 1.85
        run: cargo test --workspace --locked || cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true

  harness:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and kinit against MIT 1.22.2
        run: ./scripts/run-harness.sh
      - name: client-gate
        env:
          KERBER_LIVE: "1"
        run: ./scripts/client-gate.sh
      - name: Stop MIT harness
        if: always()
        run: ./scripts/stop-harness.sh || true
      - name: kdc-gate (MIT client vs Rust KDC)
        run: ./scripts/kdc-gate.sh
      - name: bidirectional Rust client vs Rust KDC
        run: ./scripts/bidirectional-gate.sh
