name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: test --release
        run: cargo test --workspace --release
      - name: doc
        run: cargo doc --workspace --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: MSRV 1.85 (locked)
        run: cargo test --workspace --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  harness:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and kinit against MIT 1.22.2
        run: ./scripts/run-harness.sh
      - name: client-gate
        env:
          KERBER_LIVE: "1"
        run: ./scripts/client-gate.sh
      - name: Stop MIT harness
        if: always()
        run: ./scripts/stop-harness.sh || true
      - name: kdc-gate (MIT client vs Rust KDC)
        run: ./scripts/kdc-gate.sh
      - name: bidirectional Rust client vs Rust KDC
        run: ./scripts/bidirectional-gate.sh
      - name: gss-gate (MIT libgssapi vs krb5-gss)
        run: ./scripts/gss-gate.sh
      - name: pkinit-gate (MIT pkinit.so vs Rust KDC)
        run: ./scripts/pkinit-gate.sh
      - name: kadmin-gate (MIT kadmin vs krb5-kadmind)
        run: ./scripts/kadmin-gate.sh
      - name: kpasswd-gate (MIT kpasswd vs kadmind 464)
        run: ./scripts/kpasswd-gate.sh
      - name: kdb-dump-gate (MIT dump/load + kinit both directions)
        run: ./scripts/kdb-dump-gate.sh
      - name: kprop-gate (MIT kprop dump v7 vs Rust kpropd)
        run: ./scripts/kprop-gate.sh
      - name: kprop-reverse-gate (Rust kprop vs MIT kpropd)
        run: ./scripts/kprop-reverse-gate.sh
      - name: restart-gate (persist mutation survives KDC relaunch)
        run: ./scripts/restart-gate.sh
      - name: prod-gate (kinit + log analysis + pcap)
        run: ./scripts/prod-gate.sh
      - name: prod-realm-gate (multi-host MIT client + kprop failover)
        run: ./scripts/prod-realm-gate.sh
      - name: cross-realm-gate
        run: ./scripts/cross-realm-gate.sh
      - name: spake-gate
        run: ./scripts/spake-gate.sh
      - name: sha2-gate
        run: ./scripts/sha2-gate.sh
      - name: s4u-mit-gate (MIT kvno -U / -U -P vs Rust KDC)
        run: ./scripts/s4u-mit-gate.sh
      - name: Build Samba AD DC image (harness/samba)
        run: docker build -f harness/samba/Dockerfile -t samba-ad-dc:latest .
      - name: samba-ad-gate (Samba 4 AD DC live kinit/kvno)
        run: ./scripts/samba-ad-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
          SAMBA_AD_REALM: AD.KERBER.TEST
          SAMBA_AD_USER: Administrator
          SAMBA_AD_PASSWORD: Samba-Admin-Kerber-2026!
      - name: ad-windows-gate (live Samba kinit kbruser + kvno host/svc)
        run: ./scripts/ad-windows-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: ad-s4u-gate (live Samba S4U2Self/Proxy)
        run: ./scripts/ad-s4u-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: samba-pac-verify-gate (L1 Samba decode of Rust PAC)
        run: ./scripts/samba-pac-verify-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: samba-pac-l2-gate (Samba kcrypto, vendored reference)
        run: ./scripts/samba-pac-l2-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: samba-crossrealm-gate (L3 both-direction PAC)
        run: ./scripts/samba-crossrealm-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: Build peer Samba DC (KERBER.TEST)
        run: docker build -f harness/samba/Dockerfile --build-arg SAMBA_REALM=KERBER.TEST --build-arg SAMBA_DOMAIN=KERBER -t samba-kerber-dc:latest .
      - name: samba-realtrust-gate (samba-tool trust + reverse PAC SID)
        run: ./scripts/samba-realtrust-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
          SAMBA_KERBER_IMAGE: samba-kerber-dc:latest
