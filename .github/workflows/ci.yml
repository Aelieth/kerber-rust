name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: test
        run: cargo nextest run --workspace
      - name: test --release
        run: cargo nextest run --workspace --release
      - name: doc
        run: cargo doc --workspace --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: MSRV 1.95 (locked)
        run: cargo test --workspace --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Install cargo-geiger and cargo-vet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger,cargo-vet@0.10.0
      - name: cargo-geiger (per-crate, 0-unsafe product)
        run: ./scripts/geiger.sh
        env:
          GEIGER_DEPS_OUT: ${{ runner.temp }}/geiger-deps.txt
      - name: cargo-vet
        run: cargo vet --locked

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Scratch dir
        run: echo "KERBER_SCRATCH=${{ runner.temp }}/kerber" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: MIT KDC image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/Dockerfile
          load: true
          tags: kerber-rust-mit-kdc:1.22.2
          cache-from: type=gha,scope=mit-kdc
          cache-to: type=gha,mode=max,scope=mit-kdc
      - name: Build and kinit against MIT 1.22.2
        run: ./scripts/run-harness.sh
      - name: client-gate
        env:
          KERBER_LIVE: "1"
        run: ./scripts/client-gate.sh
      - name: ccache-gate
        env:
          KERBER_LIVE: "1"
        run: ./scripts/ccache-gate.sh
      - name: knobs-gate
        env:
          KERBER_LIVE: "1"
        run: ./scripts/knobs-gate.sh
      - name: Stop MIT harness
        if: always()
        run: ./scripts/stop-harness.sh || true
      - name: kdc-gate (MIT client vs Rust KDC)
        run: ./scripts/kdc-gate.sh
      - name: store-gate (MemoryStore serve + MIT kinit/kvno)
        run: ./scripts/store-gate.sh
      - name: bidirectional Rust client vs Rust KDC
        run: ./scripts/bidirectional-gate.sh
      - name: gss-gate (MIT libgssapi vs krb5-gss)
        run: ./scripts/gss-gate.sh
      - name: pkinit-gate (MIT pkinit.so vs Rust KDC)
        run: ./scripts/pkinit-gate.sh
      - name: kadmin-gate (MIT kadmin vs krb5-kadmind)
        run: ./scripts/kadmin-gate.sh
      - name: policy-gate (MIT kadmin addpol/modpol/getpol/delpol/listpols + kinit lockout)
        run: ./scripts/policy-gate.sh
      - name: history-mit-gate (MIT kadmin.local history-window oracle)
        run: ./scripts/history-mit-gate.sh
      - name: kpasswd-gate (MIT kpasswd vs kadmind 464)
        run: ./scripts/kpasswd-gate.sh
      - name: kdb-dump-gate (MIT dump/load + kinit both directions)
        run: ./scripts/kdb-dump-gate.sh
      - name: differential-gate (same AS/TGS bytes to Rust and MIT)
        run: ./scripts/differential-gate.sh
      - name: kprop-gate (MIT kprop dump v7 vs Rust kpropd)
        run: ./scripts/kprop-gate.sh
      - name: kprop-reverse-gate (Rust kprop vs MIT kpropd)
        run: ./scripts/kprop-reverse-gate.sh
      - name: iprop-gate (MIT kpropd -A vs Rust kadmind + serial-delta)
        run: ./scripts/iprop-gate.sh
      - name: expire-gate (MIT kinit NAME_EXP / KEY_EXPIRED / PWCHANGE_SERVICE)
        run: ./scripts/expire-gate.sh
      - name: flags-gate (MIT modprinc DISALLOW_* / OK_AS_DELEGATE / REQUIRES_HW_AUTH)
        run: ./scripts/flags-gate.sh
      - name: renew-gate (MIT kinit -R / kinit -p vs Rust KDC)
        run: ./scripts/renew-gate.sh
      - name: sssd-renew / kit / gssproxy / nfs (exit 2 until vendored)
        run: |
          skip2() {
            set +e
            "$@"
            rc=$?
            set -e
            if [ "$rc" -eq 2 ]; then
              echo "$1 skipped (exit 2)"
              return 0
            fi
            return "$rc"
          }
          skip2 ./scripts/sssd-renew-gate.sh
          skip2 ./scripts/kit-conformance-gate.sh
          skip2 ./scripts/gssproxy-gate.sh
          skip2 ./scripts/nfs-krb5p-gate.sh
      - name: postdate-gate (MIT kinit -s / kinit -v vs Rust KDC)
        run: ./scripts/postdate-gate.sh
      - name: getprivs-gate (MIT kadmin getprivs limited ACL actor)
        run: ./scripts/getprivs-gate.sh
      - name: prop-acl-gate (MIT kprop unauthorized GSS peer refused)
        run: ./scripts/prop-acl-gate.sh
      - name: restart-gate (persist mutation survives KDC relaunch)
        run: ./scripts/restart-gate.sh
      - name: prod-gate (kinit + log analysis + pcap)
        run: ./scripts/prod-gate.sh
      - name: prod-node capture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/prod/Dockerfile
          load: true
          tags: kerber-rust-prod-node:latest
          cache-from: type=gha,scope=prod-node
          cache-to: type=gha,mode=max,scope=prod-node
      - name: prod-realm-gate (multi-host MIT client + kprop failover)
        env:
          KERBER_REQUIRE_REAL_PCAP: "1"
        run: ./scripts/prod-realm-gate.sh
      - name: cross-realm-gate
        run: ./scripts/cross-realm-gate.sh
      - name: spake-gate
        run: ./scripts/spake-gate.sh
      - name: rust-kinit-spake-gate (Rust kinit SPAKE vs MIT KDC)
        run: ./scripts/rust-kinit-spake-gate.sh
      - name: rust-kinit-fast-gate (Rust kinit FAST vs MIT KDC)
        run: ./scripts/rust-kinit-fast-gate.sh
      - name: mit-fast-kdc-gate (MIT kinit -T FAST vs Rust KDC)
        run: ./scripts/mit-fast-kdc-gate.sh
      - name: rust-kinit-pkinit-gate (Rust kinit PKINIT vs MIT KDC)
        run: ./scripts/rust-kinit-pkinit-gate.sh
      - name: rust-kinit-enterprise-gate (NT-ENTERPRISE both directions)
        run: ./scripts/rust-kinit-enterprise-gate.sh
      - name: ktutil-gate (MIT ktadd list + Rust keytab kinit -k)
        run: ./scripts/ktutil-gate.sh
      - name: kadmin-local-gate (local verbs; MIT kadmin getprinc)
        run: ./scripts/kadmin-local-gate.sh
      - name: rust-kpasswd-mit-gate (Rust kpasswd vs MIT kadmind)
        run: ./scripts/rust-kpasswd-mit-gate.sh
      - name: sha2-gate
        run: ./scripts/sha2-gate.sh
      - name: s4u-mit-gate (MIT kvno -U / -U -P vs Rust KDC)
        run: ./scripts/s4u-mit-gate.sh

  slo:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Scratch dir
        run: echo "KERBER_SCRATCH=${{ runner.temp }}/kerber" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: MIT KDC image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/Dockerfile
          load: true
          tags: kerber-rust-mit-kdc:1.22.2
          cache-from: type=gha,scope=mit-kdc
          cache-to: type=gha,mode=max,scope=mit-kdc
      - name: prod-node capture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/prod/Dockerfile
          load: true
          tags: kerber-rust-prod-node:latest
          cache-from: type=gha,scope=prod-node
          cache-to: type=gha,mode=max,scope=prod-node
      - name: stress-gate (wire AS+TGS + latency SLO)
        run: ./scripts/stress-gate.sh

  chaos:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Scratch dir
        run: echo "KERBER_SCRATCH=${{ runner.temp }}/kerber" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: MIT KDC image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/Dockerfile
          load: true
          tags: kerber-rust-mit-kdc:1.22.2
          cache-from: type=gha,scope=mit-kdc
          cache-to: type=gha,mode=max,scope=mit-kdc
      - name: prod-node capture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/prod/Dockerfile
          load: true
          tags: kerber-rust-prod-node:latest
          cache-from: type=gha,scope=prod-node
          cache-to: type=gha,mode=max,scope=prod-node
      - name: chaos-gate (netem + memory + failover-under-load)
        env:
          KERBER_REQUIRE_NETEM: "1"
        run: ./scripts/chaos-gate.sh

  soak:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Scratch dir
        run: echo "KERBER_SCRATCH=${{ runner.temp }}/kerber" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: MIT KDC image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/Dockerfile
          load: true
          tags: kerber-rust-mit-kdc:1.22.2
          cache-from: type=gha,scope=mit-kdc
          cache-to: type=gha,mode=max,scope=mit-kdc
      - name: prod-node capture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/prod/Dockerfile
          load: true
          tags: kerber-rust-prod-node:latest
          cache-from: type=gha,scope=prod-node
          cache-to: type=gha,mode=max,scope=prod-node
      - name: soak-gate (bounded leak detection)
        env:
          KERBER_REQUIRE_REAL_PCAP: "1"
        run: ./scripts/soak-gate.sh

  peers:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Scratch dir
        run: echo "KERBER_SCRATCH=${{ runner.temp }}/kerber" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: MIT KDC image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/Dockerfile
          load: true
          tags: kerber-rust-mit-kdc:1.22.2
          cache-from: type=gha,scope=mit-kdc
          cache-to: type=gha,mode=max,scope=mit-kdc
      - name: Samba AD DC image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/samba/Dockerfile
          load: true
          tags: samba-ad-dc:latest
          cache-from: type=gha,scope=samba-ad
          cache-to: type=gha,mode=max,scope=samba-ad
      - name: samba-ad-gate (Samba 4 AD DC live kinit/kvno)
        run: ./scripts/samba-ad-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
          SAMBA_AD_REALM: AD.KERBER.TEST
          SAMBA_AD_USER: Administrator
          SAMBA_AD_PASSWORD: ${{ secrets.SAMBA_AD_PASSWORD }}
      - name: ad-windows-gate (live Samba kinit kbruser + kvno host/svc)
        run: ./scripts/ad-windows-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: ad-s4u-gate (live Samba S4U2Self/Proxy)
        run: ./scripts/ad-s4u-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: samba-pac-verify-gate (L1 Samba decode of Rust PAC)
        run: ./scripts/samba-pac-verify-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: samba-pac-l2-gate (Samba kcrypto, vendored reference)
        run: ./scripts/samba-pac-l2-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: samba-crossrealm-gate (L3 both-direction PAC)
        run: ./scripts/samba-crossrealm-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: peer Samba DC (KERBER.TEST)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/samba/Dockerfile
          load: true
          tags: samba-kerber-dc:latest
          build-args: |
            SAMBA_REALM=KERBER.TEST
            SAMBA_DOMAIN=KERBER
          cache-from: type=gha,scope=samba-kerber
          cache-to: type=gha,mode=max,scope=samba-kerber
      - name: samba-realtrust-gate (samba-tool trust + reverse PAC SID)
        run: ./scripts/samba-realtrust-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
          SAMBA_KERBER_IMAGE: samba-kerber-dc:latest
      - name: Heimdal 7.8 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/heimdal/Dockerfile
          load: true
          tags: kerber-rust-heimdal-kdc:latest
          cache-from: type=gha,scope=heimdal
          cache-to: type=gha,mode=max,scope=heimdal
      - name: heimdal-gate (Heimdal 7.8 bidirectional)
        run: ./scripts/heimdal-gate.sh
