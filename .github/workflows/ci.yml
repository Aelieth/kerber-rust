      - name: chaos-gate (netem + memory + failover-under-load)
        env:
          KERBER_REQUIRE_NETEM: "1"
        run: ./scripts/chaos-gate.sh

  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    needs: mit-image
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
