name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  KERBER_NEED_BINS_STRICT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # R2-T3: full history so ci-policy's red-at-sha overlay-probe can see
          # its historical base SHA (a shallow depth-1 clone cannot).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install lld
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lld
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kerber
      - name: CI policy
        run: python3 scripts/ci-policy.py
      - name: gate ERR-trap self-test (silent gate deaths become annotations)
        run: ./scripts/gate-err-trap-selftest.sh
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: build tests
        run: cargo nextest run --workspace --profile ci --no-run
      - name: test
        env:
          KRB5_CONFIG: ${{ github.workspace }}/harness/nextest-krb5.conf
        run: cargo nextest run --workspace --profile ci
      - name: Annotate nextest failures
        # Job logs are private; the annotations are public and are what
        # scripts/ci-status.py reads. One ::error per failed testcase.
        if: failure()
        run: python3 scripts/lib/junit-annotate.py target/nextest/ci/junit.xml
      - name: Upload nextest junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: error

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install lld
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lld
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kerber
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95
      - name: Install lld
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lld
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kerber
      - name: MSRV 1.95 build (locked)
        run: cargo build --workspace --all-targets --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install lld
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lld
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kerber
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Install cargo-geiger and cargo-vet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger,cargo-vet@0.10.0
      - name: cargo-geiger (per-crate, 0-unsafe product)
        run: ./scripts/geiger.sh
        env:
          GEIGER_DEPS_OUT: ${{ runner.temp }}/geiger-deps.txt
      - name: cargo-vet
        run: cargo vet --locked

  ledger-mit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # R2-T3: overlay-probe needs the historical base SHA
      - name: Fetch MIT 1.22.2 source (SHA-pinned, same as harness/Dockerfile)
        run: |
          set -euo pipefail
          url=https://web.mit.edu/kerberos/dist/krb5/1.22/krb5-1.22.2.tar.gz
          sha=3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13
          for attempt in 1 2 3; do
            if wget -q -O /tmp/krb5.tar.gz "$url"; then break; fi
            sleep $((attempt * 5))
          done
          echo "$sha  /tmp/krb5.tar.gz" | sha256sum -c -
          mkdir -p /tmp/krb5-src
          tar -xzf /tmp/krb5.tar.gz -C /tmp/krb5-src
          echo "KERBER_MIT_SRC=/tmp/krb5-src/krb5-1.22.2/src" >> "$GITHUB_ENV"
      - name: Verify MIT-side ledger anchors against the 1.22.2 tree
        run: python3 scripts/ci-policy.py

  mit-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/kerber-rust-mit-kdc.tar
            /tmp/kerber-rust-prod-node.tar
          key: mit-kdc-1.22.2-${{ hashFiles('harness/Dockerfile', 'harness/krb5.conf', 'harness/kdc.conf', 'harness/kadm5.acl', 'harness/krb5-sha2.conf', 'harness/entrypoint.sh', 'harness/prod/Dockerfile') }}
      - name: Load cached MIT+prod images or docker build
        run: |
          set -euo pipefail
          mit_tar=/tmp/kerber-rust-mit-kdc.tar
          prod_tar=/tmp/kerber-rust-prod-node.tar
          mit=kerber-rust-mit-kdc:1.22.2
          prod=kerber-rust-prod-node:latest
          if [ -f "$mit_tar" ]; then
            docker load -i "$mit_tar"
          else
            docker build -f harness/Dockerfile -t "$mit" .
            docker save "$mit" -o "$mit_tar"
          fi
          docker image inspect "$mit" >/dev/null
          if [ -f "$prod_tar" ]; then
            docker load -i "$prod_tar"
          else
            docker build -f harness/prod/Dockerfile -t "$prod" .
            docker save "$prod" -o "$prod_tar"
          fi
          docker image inspect "$prod" >/dev/null

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: mit-image
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kerber
      - name: Install lld
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lld
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/kerber-rust-mit-kdc.tar
            /tmp/kerber-rust-prod-node.tar
          key: mit-kdc-1.22.2-${{ hashFiles('harness/Dockerfile', 'harness/krb5.conf', 'harness/kdc.conf', 'harness/kadm5.acl', 'harness/krb5-sha2.conf', 'harness/entrypoint.sh', 'harness/prod/Dockerfile') }}
      - name: docker load MIT and prod images
        run: |
          set -euo pipefail
          docker load -i /tmp/kerber-rust-mit-kdc.tar
          docker load -i /tmp/kerber-rust-prod-node.tar
          echo "KERBER_SKIP_MIT_BUILD=1" >> "$GITHUB_ENV"
      - name: Scratch dir
        run: echo "KERBER_SCRATCH=${{ runner.temp }}/kerber" >> "$GITHUB_ENV"
      - name: Build bins
        run: ./scripts/lib/build-bins.sh
      - name: Build and kinit against MIT 1.22.2
        run: ./scripts/run-harness.sh
      - name: client-gate
        run: ./scripts/client-gate.sh
      - name: ccache-gate
        run: ./scripts/ccache-gate.sh
      - name: knobs-gate
        run: ./scripts/knobs-gate.sh
      - name: config-include-gate
        run: ./scripts/config-include-gate.sh
      - name: Stop MIT harness
        if: always()
        run: ./scripts/stop-harness.sh || true
      - name: shared shell + stock MIT
        run: |
          ./scripts/lib/boot-shell.sh
          ./scripts/lib/boot-stock-mit.sh
      - name: attach-reset proxy self-test
        run: ./scripts/gate-attach-reset-selftest.sh
      - name: kdc-gate (MIT client vs Rust KDC)
        run: ./scripts/kdc-gate.sh
      - name: store-gate (MemoryStore serve + MIT kinit/kvno)
        run: ./scripts/store-gate.sh
      - name: bidirectional Rust client vs Rust KDC
        run: ./scripts/bidirectional-gate.sh
      - name: gss-gate (MIT libgssapi vs krb5-gss)
        run: ./scripts/gss-gate.sh
      - name: pkinit-gate (MIT pkinit.so vs Rust KDC)
        run: ./scripts/pkinit-gate.sh
      - name: kadmin-rust-gate
        env:
          KERBER_KADMIN_KEEP: "1"
        run: ./scripts/kadmin-rust-gate.sh
      - name: kadmin-rust-acl-gate
        env:
          KERBER_KADMIN_KEEP: "1"
        run: ./scripts/kadmin-rust-acl-gate.sh
      - name: kadmin-mit-gate
        env:
          KERBER_KADMIN_KEEP: "1"
        run: ./scripts/kadmin-mit-gate.sh
      - name: kadmin-both-gate
        run: ./scripts/kadmin-both-gate.sh
      - name: kadmin containers cleanup
        if: always()
        run: docker rm -f kerber-rust-kadmin-gate kerber-rust-kadmin-mit >/dev/null 2>&1 || true
      - name: policy-gate (MIT kadmin addpol/modpol/getpol/delpol/listpols + kinit lockout)
        run: ./scripts/policy-gate.sh
      - name: history-mit-gate (MIT kadmin.local history-window oracle)
        run: ./scripts/history-mit-gate.sh
      - name: shared topology cleanup
        if: always()
        run: docker rm -f kerber-rust-shell kerber-rust-mit-kdc >/dev/null 2>&1 || true

  harness-2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: mit-image
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kerber
      - name: Install lld
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lld
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/kerber-rust-mit-kdc.tar
            /tmp/kerber-rust-prod-node.tar
          key: mit-kdc-1.22.2-${{ hashFiles('harness/Dockerfile', 'harness/krb5.conf', 'harness/kdc.conf', 'harness/kadm5.acl', 'harness/krb5-sha2.conf', 'harness/entrypoint.sh', 'harness/prod/Dockerfile') }}
      - name: docker load MIT and prod images
        run: |
          set -euo pipefail
          docker load -i /tmp/kerber-rust-mit-kdc.tar
          docker load -i /tmp/kerber-rust-prod-node.tar
          echo "KERBER_SKIP_MIT_BUILD=1" >> "$GITHUB_ENV"
      - name: Scratch dir
        run: echo "KERBER_SCRATCH=${{ runner.temp }}/kerber" >> "$GITHUB_ENV"
      - name: Build bins
        run: ./scripts/lib/build-bins.sh
      - name: shared shell + stock MIT
        run: |
          ./scripts/lib/boot-shell.sh
          ./scripts/lib/boot-stock-mit.sh
      - name: kpasswd-rust-gate
        env:
          KERBER_KPASSWD_KEEP: "1"
        run: ./scripts/kpasswd-rust-gate.sh
      - name: kpasswd-mit-gate
        run: ./scripts/kpasswd-mit-gate.sh
      - name: kdb-dump-gate (MIT dump/load + kinit both directions)
        run: ./scripts/kdb-dump-gate.sh
      - name: differential-gate (same AS/TGS bytes to Rust and MIT)
        run: ./scripts/differential-gate.sh
      - name: kprop-gate (MIT kprop dump v7 vs Rust kpropd)
        run: ./scripts/kprop-gate.sh
      - name: kprop-reverse-gate (Rust kprop vs MIT kpropd)
        run: ./scripts/kprop-reverse-gate.sh
      - name: rd-safe-oracle-gate (MIT krb5_rd_safe non-canonical body)
        run: ./scripts/rd-safe-oracle-gate.sh
      - name: cross-kdc-gate (MIT TGT to Rust TGS and back on one dump)
        run: ./scripts/cross-kdc-gate.sh
      - name: iprop-gate (MIT kpropd -A vs Rust kadmind + serial-delta)
        run: ./scripts/iprop-gate.sh
      - name: expire-gate (MIT kinit NAME_EXP / KEY_EXPIRED / PWCHANGE_SERVICE)
        run: ./scripts/expire-gate.sh
      - name: kdcpolicy-gate (MIT kdcpolicy_test.so vs Rust TestPolicy)
        run: ./scripts/kdcpolicy-gate.sh
      - name: flags-gate (MIT modprinc DISALLOW_* / OK_AS_DELEGATE / REQUIRES_HW_AUTH)
        run: ./scripts/flags-gate.sh
      - name: renew-gate (MIT kinit -R / kinit -p vs Rust KDC)
        run: ./scripts/renew-gate.sh
      - name: sssd-renew / kit / gssproxy / nfs (exit 2 until vendored)
        run: |
          skip2() {
            set +e
            "$@"
            rc=$?
            set -e
            if [ "$rc" -eq 2 ]; then
              echo "$1 skipped (exit 2)"
              return 0
            fi
            return "$rc"
          }
          skip2 ./scripts/sssd-renew-gate.sh
          skip2 ./scripts/kit-conformance-gate.sh
          skip2 ./scripts/gssproxy-gate.sh
          skip2 ./scripts/nfs-krb5p-gate.sh
      - name: postdate-gate (MIT kinit -s / kinit -v vs Rust KDC)
        run: ./scripts/postdate-gate.sh
      - name: getprivs-gate (MIT kadmin getprivs limited ACL actor)
        run: ./scripts/getprivs-gate.sh
      - name: prop-acl-gate (MIT kprop unauthorized GSS peer refused)
        run: ./scripts/prop-acl-gate.sh
      - name: restart-gate (persist mutation survives KDC relaunch)
        run: ./scripts/restart-gate.sh
      - name: prod-gate (kinit + log analysis + pcap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcpdump
          ./scripts/prod-gate.sh
      - name: prod-realm-gate (multi-host MIT client + kprop failover)
        env:
          KERBER_REQUIRE_REAL_PCAP: "1"
        run: ./scripts/prod-realm-gate.sh
      - name: shared topology cleanup
        if: always()
        run: docker rm -f kerber-rust-shell kerber-rust-mit-kdc >/dev/null 2>&1 || true

  mit-extra:
