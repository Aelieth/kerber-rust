name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

env:
  KERBER_NEED_BINS_STRICT: "1"

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # R2-T3: full history so ci-policy's red-at-sha overlay-probe can see
          # its historical base SHA (a shallow depth-1 clone cannot).
          fetch-depth: 0
      - uses: ./.github/actions/rust-preamble
        with:
          components: rustfmt, clippy
      - name: CI policy
        run: python3 scripts/ci-policy.py
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: clippy (no features)
        # The release configuration, as `make build` makes it: code under
        # `cfg(not(feature = "test-hooks"))` is linted only here.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install cargo-nextest
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: nextest
      - name: build tests
        run: cargo nextest run --workspace --profile ci --no-run --features krb5-kdc/test-hooks,krb5-admin/test-hooks,krb5-client/test-hooks
      - name: test
        env:
          KRB5_CONFIG: ${{ github.workspace }}/harness/nextest-krb5.conf
        run: cargo nextest run --workspace --profile ci --features krb5-kdc/test-hooks,krb5-admin/test-hooks,krb5-client/test-hooks
      - name: test (release build, no features)
        # The release-only units: a build without the test-hooks features, as `make build` makes.
        # Its own profile keeps its junit beside the features run's, not over it.
        timeout-minutes: 10
        env:
          KRB5_CONFIG: ${{ github.workspace }}/harness/nextest-krb5.conf
        run: cargo nextest run --workspace --profile ci-nofeatures --locked
      - name: doctests
        env:
          KRB5_CONFIG: ${{ github.workspace }}/harness/nextest-krb5.conf
        run: cargo test --workspace --doc --features krb5-kdc/test-hooks,krb5-admin/test-hooks,krb5-client/test-hooks
      - name: Annotate nextest failures
        # Job logs are private; the annotations are public and are what
        # scripts/ci-status.py reads. One ::error per failed testcase.
        if: failure()
        run: |
          python3 scripts/lib/junit-annotate.py target/nextest/ci/junit.xml
          if [ -f target/nextest/ci-nofeatures/junit.xml ]; then
            python3 scripts/lib/junit-annotate.py target/nextest/ci-nofeatures/junit.xml
          fi
      - name: Upload nextest junit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-junit
          path: |
            target/nextest/ci/junit.xml
            target/nextest/ci-nofeatures/junit.xml
          retention-days: 7
          if-no-files-found: error

  doc:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-preamble
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: fuzz crate
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins

  shellcheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # The version make shellcheck and the hygiene inventory run (koalaman/shellcheck:v0.11.0).
      # The image package is not this pin. Ubuntu 24.04 shipped 0.9.0, whose
      # SC2317/SC2119 heuristics report about 490 notes. 0.11.0 does not, so the
      # checks must not move with the runner image.
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          set -euo pipefail
          f="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl -fsSL -o "$f" "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$f"
          echo "$SHELLCHECK_SHA256  $f" | sha256sum --check
          tar -xJf "$f"
          sudo install -m 0755 "shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck
      - name: shellcheck -S style (zero inline disables; .shellcheckrc follows sources)
        run: |
          shellcheck --version
          shellcheck -S style scripts/*.sh scripts/lib/*.sh harness/*.sh dist/*.sh harness/field/*.sh harness/field/lib/*.sh harness/field/scenarios/*.sh

  msrv:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # rust-toolchain.toml pins stable; the env pin outranks it (ci-policy check_msrv_pinned).
    env:
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-preamble
        with:
          toolchain: "1.95"
      - name: MSRV 1.95 build (locked)
        run: cargo build --workspace --all-targets --locked --features krb5-kdc/test-hooks,krb5-admin/test-hooks,krb5-client/test-hooks
      - name: MSRV 1.95 build (locked, no features)
        run: cargo build --workspace --all-targets --locked

  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Prebuilt cargo-audit. No check run and no advisory issues.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-preamble
      - name: Install cargo-audit
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-audit@0.22.2
      - name: cargo-audit
        run: cargo audit --deny warnings
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - name: Install cargo-vet
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-vet@0.10.0
      - name: cargo-vet
        run: cargo vet --locked

  mit-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-preamble
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/kerber-rust-mit-kdc.tar
          key: mit-kdc-1.22.2-${{ hashFiles('harness/Dockerfile', 'harness/krb5.conf', 'harness/krb5-sha2.conf', 'harness/kdc.conf', 'harness/kadm5.acl', 'harness/entrypoint.sh') }}
      - name: Load cached MIT image or docker build
        run: |
          set -euo pipefail
          mit_tar=/tmp/kerber-rust-mit-kdc.tar
          mit=kerber-rust-mit-kdc:1.22.2
          if [ -f "$mit_tar" ]; then
            docker load -i "$mit_tar"
          else
            docker build -f harness/Dockerfile -t "$mit" .
            docker save "$mit" -o "$mit_tar"
          fi
          docker image inspect "$mit" >/dev/null
          echo "KERBER_SKIP_MIT_BUILD=1" >> "$GITHUB_ENV"
      - name: Scratch dir
        run: echo "KERBER_SCRATCH=${{ runner.temp }}/kerber" >> "$GITHUB_ENV"
      - name: Build bins
        run: ./scripts/lib/build-bins.sh
      - name: Build and kinit against MIT 1.22.2
        run: ./scripts/run-harness.sh
      - name: "client-gate"
        run: ./scripts/client-gate.sh
      - name: Stop MIT harness
        if: always()
        run: ./scripts/stop-harness.sh || true
      - name: shared shell + stock MIT
        run: |
          ./scripts/lib/boot-shell.sh
          ./scripts/lib/boot-stock-mit.sh
      - name: "kdc-gate (MIT client vs Rust KDC)"
        run: ./scripts/kdc-gate.sh
      - name: "differential-gate (same AS/TGS bytes to Rust and MIT)"
        run: ./scripts/differential-gate.sh
      - name: shared topology cleanup
        if: always()
        run: docker rm -f kerber-rust-shell kerber-rust-mit-kdc kerber-rust-kadmin-gate kerber-rust-kadmin-mit >/dev/null 2>&1 || true
