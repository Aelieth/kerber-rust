name: peers

permissions:
  contents: read

on:
  schedule:
    - cron: "12 6 * * *"
  workflow_dispatch:

env:
  KERBER_NEED_BINS_STRICT: "1"
  # The tally fails the job unless this many peer steps ran and passed.
  KERBER_PEER_STEPS: "7"

jobs:
  peers:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-preamble
      - name: Scratch dir
        run: echo "KERBER_SCRATCH=${{ runner.temp }}/kerber" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/kerber-rust-mit-kdc.tar
          key: mit-kdc-1.22.2-${{ hashFiles('harness/Dockerfile', 'harness/krb5.conf', 'harness/krb5-sha2.conf', 'harness/kdc.conf', 'harness/kadm5.acl', 'harness/entrypoint.sh') }}
      - name: Load cached MIT image or docker build
        run: |
          set -euo pipefail
          mit_tar=/tmp/kerber-rust-mit-kdc.tar
          mit=kerber-rust-mit-kdc:1.22.2
          if [ -f "$mit_tar" ]; then
            docker load -i "$mit_tar"
          else
            docker build -f harness/Dockerfile -t "$mit" .
            docker save "$mit" -o "$mit_tar"
          fi
          docker image inspect "$mit" >/dev/null
          echo "KERBER_SKIP_MIT_BUILD=1" >> "$GITHUB_ENV"
      - name: Build bins
        run: ./scripts/lib/build-bins.sh
      - name: Build Samba AD DC image (harness/samba)
        if: always()
        run: docker build -f harness/samba/Dockerfile -t samba-ad-dc:latest .
      - name: samba-ad-gate (Samba 4 AD DC live kinit/kvno)
        if: always()
        run: ./scripts/lib/run-peer-step.sh ./scripts/samba-ad-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
          SAMBA_AD_REALM: AD.KERBER.TEST
          SAMBA_AD_USER: Administrator
          SAMBA_AD_PASSWORD: ${{ secrets.SAMBA_AD_PASSWORD }}
      - name: ad-windows-gate (live Samba kinit kbruser + kvno host/svc)
        if: always()
        run: ./scripts/lib/run-peer-step.sh ./scripts/ad-windows-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: ad-s4u-gate (live Samba S4U2Self/Proxy)
        if: always()
        run: ./scripts/lib/run-peer-step.sh ./scripts/ad-s4u-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: samba-pac-verify-gate (L1 Samba decode of Rust PAC)
        if: always()
        run: ./scripts/lib/run-peer-step.sh ./scripts/samba-pac-verify-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: samba-pac-l2-gate (Samba kcrypto, vendored reference)
        if: always()
        run: ./scripts/lib/run-peer-step.sh ./scripts/samba-pac-l2-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: samba-crossrealm-gate (L3 both-direction PAC)
        if: always()
        run: ./scripts/lib/run-peer-step.sh ./scripts/samba-crossrealm-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
      - name: Build peer Samba DC (KERBER.TEST)
        if: always()
        run: docker build -f harness/samba/Dockerfile --build-arg SAMBA_REALM=KERBER.TEST --build-arg SAMBA_DOMAIN=KERBER -t samba-kerber-dc:latest .
      - name: samba-realtrust-gate (samba-tool trust + reverse PAC SID)
        if: always()
        run: ./scripts/lib/run-peer-step.sh ./scripts/samba-realtrust-gate.sh
        env:
          SAMBA_AD_IMAGE: samba-ad-dc:latest
          SAMBA_KERBER_IMAGE: samba-kerber-dc:latest
      - name: peer tally
        if: always()
        run: |
          set -euo pipefail
          f="${KERBER_SCRATCH}/peer-tally.txt"
          ok=0
          unavail=0
          fail=0
          if [ -f "$f" ]; then
            ok=$(grep -c '^ok$' "$f" || true)
            unavail=$(grep -c '^unavailable$' "$f" || true)
            fail=$(grep -c '^failed$' "$f" || true)
          fi
          echo "ok=$ok unavailable=$unavail failed=$fail of $KERBER_PEER_STEPS"
          test "$ok" -eq "$KERBER_PEER_STEPS"
