name: full-test

permissions:
  contents: read

on:
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-preamble
      - name: Install cargo-nextest
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: nextest
      - name: test --release
        env:
          KRB5_CONFIG: ${{ github.workspace }}/harness/nextest-krb5.conf
        run: cargo nextest run --workspace --release --profile ci

  msrv-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # rust-toolchain.toml pins stable; the env pin outranks it (ci-policy check_msrv_pinned).
    env:
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-preamble
        with:
          toolchain: "1.95"
      - name: MSRV 1.95 test (locked)
        run: cargo test --workspace --locked
