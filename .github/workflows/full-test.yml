name: full-test

permissions:
  contents: read

on:
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-preamble
      - name: Install cargo-nextest
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: nextest
      - name: test --release
        env:
          KRB5_CONFIG: ${{ github.workspace }}/harness/nextest-krb5.conf
        run: cargo nextest run --workspace --release --profile ci

  msrv-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # rust-toolchain.toml pins stable; the env pin outranks it (ci-policy check_msrv_pinned).
    env:
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-preamble
        with:
          toolchain: "1.95"
      - name: MSRV 1.95 test (locked)
        run: cargo test --workspace --locked
