name: soak

permissions:
  contents: read

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

env:
  KERBER_NEED_BINS_STRICT: "1"

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-preamble
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/kerber-rust-mit-kdc.tar
            /tmp/kerber-rust-prod-node.tar
          key: mit-kdc-1.22.2-${{ hashFiles('harness/Dockerfile', 'harness/krb5.conf', 'harness/kdc.conf', 'harness/kadm5.acl', 'harness/krb5-sha2.conf', 'harness/entrypoint.sh', 'harness/prod/Dockerfile') }}
      - name: Load cached MIT+prod images or docker build
        run: |
          set -euo pipefail
          mit_tar=/tmp/kerber-rust-mit-kdc.tar
          prod_tar=/tmp/kerber-rust-prod-node.tar
          mit=kerber-rust-mit-kdc:1.22.2
          prod=kerber-rust-prod-node:latest
          if [ -f "$mit_tar" ]; then
            docker load -i "$mit_tar"
            echo "KERBER_SKIP_MIT_BUILD=1" >> "$GITHUB_ENV"
          else
            docker build -f harness/Dockerfile -t "$mit" .
            docker save "$mit" -o "$mit_tar"
          fi
          if [ -f "$prod_tar" ]; then
            docker load -i "$prod_tar"
          else
            docker build -f harness/prod/Dockerfile -t "$prod" .
            docker save "$prod" -o "$prod_tar"
          fi
      - name: Scratch dir
        run: echo "KERBER_SCRATCH=${{ runner.temp }}/kerber" >> "$GITHUB_ENV"
      - name: Build bins
        run: ./scripts/lib/build-bins.sh
      - name: soak-gate (scheduled window)
        env:
          KERBER_SOAK_SECONDS: "480"
          KERBER_REQUIRE_REAL_PCAP: "1"
        run: ./scripts/soak-gate.sh
