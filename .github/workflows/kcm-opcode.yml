name: kcm-opcode

permissions:
  contents: read

on:
  schedule:
    - cron: "18 7 * * *"
  workflow_dispatch:

env:
  KERBER_NEED_BINS_STRICT: "1"

jobs:
  kcm-opcode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-preamble
      - name: Scratch dir
        run: echo "KERBER_SCRATCH=${{ runner.temp }}/kerber" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/kerber-rust-mit-kdc.tar
            /tmp/kerber-rust-prod-node.tar
          key: mit-kdc-1.22.2-${{ hashFiles('harness/Dockerfile', 'harness/krb5.conf', 'harness/kdc.conf', 'harness/kadm5.acl', 'harness/krb5-sha2.conf', 'harness/entrypoint.sh', 'harness/prod/Dockerfile') }}
      - name: docker load MIT image
        run: |
          set -euo pipefail
          if [ -f /tmp/kerber-rust-mit-kdc.tar ]; then
            docker load -i /tmp/kerber-rust-mit-kdc.tar
            echo "KERBER_SKIP_MIT_BUILD=1" >> "$GITHUB_ENV"
          else
            echo "MIT tar missing from cache; kcm-opcode will unavailable (exit 2)"
          fi
      - name: Build bins
        run: ./scripts/lib/build-bins.sh
      - name: kcm-opcode-gate (F43/F42 sssd-kcm value-assert)
        run: ./scripts/lib/run-peer-step.sh ./scripts/kcm-opcode-gate.sh
