[workspace]
resolver = "2"
members = [
    "crates/krb5-log",
    "crates/krb5-crypto",
    "crates/krb5-types",
    "crates/krb5-asn1",
    "crates/krb5-config",
    "crates/krb5-protocol",
    "crates/krb5-client",
    "crates/krb5-kdc",
    "crates/krb5-gss",
    "crates/krb5-admin",
    "examples/consumer",
    "examples/kdc-consumer",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Aelieth/kerber-rust"
homepage = "https://github.com/Aelieth/kerber-rust"
authors = ["Aelieth"]
publish = false

[workspace.dependencies]
krb5-log = { path = "crates/krb5-log" }
krb5-crypto = { path = "crates/krb5-crypto" }
krb5-types = { path = "crates/krb5-types" }
krb5-asn1 = { path = "crates/krb5-asn1" }
krb5-protocol = { path = "crates/krb5-protocol" }
krb5-client = { path = "crates/krb5-client" }
krb5-kdc = { path = "crates/krb5-kdc" }
krb5-config = { path = "crates/krb5-config" }
krb5-gss = { path = "crates/krb5-gss" }
krb5-admin = { path = "crates/krb5-admin" }
aes = "0.8"
camellia = "0.1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock", "std"] }
cmac = "0.7"
des = "0.8"
getrandom = "0.2"
hmac = "0.12"
md-5 = "0.10"
md4 = "0.10"
nix = { version = "0.29", default-features = false, features = ["user", "fs", "process"] }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
signal-hook = { version = "0.3", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# 0.27.1+ uses usize::is_multiple_of as a const fn (rustc ≥ 1.87).
# Keep MSRV 1.85: pin the last 0.27 that builds on 1.85. Golden DER tests
# are the protocol safety net if encodings differ from 0.27.4.
rasn = "=0.27.0"
rc4 = "0.1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = { version = "1.8", features = ["derive", "alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "deny"
unimplemented = "deny"
needless_borrows_for_generic_args = "allow"
# Pedantic noise that is not useful in this tree: rasn field bindings,
# RFC vocabulary in rustdoc, long AS/TGS/issue functions, ACL flag
# structs, and Kerberos names (cname/crealm, KAT single-letter vars).
no_effect_underscore_binding = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
many_single_char_names = "allow"
