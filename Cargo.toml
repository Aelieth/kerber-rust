[workspace]
resolver = "2"
members = [
    "crates/krb5-log",
    "crates/krb5-cli",
    "crates/krb5-crypto",
    "crates/krb5-types",
    "crates/krb5-brainpool",
    "crates/krb5-asn1",
    "crates/krb5-config",
    "crates/krb5-protocol",
    "crates/krb5-client",
    "crates/krb5-kdc",
    "crates/krb5-gss",
    "crates/krb5-admin",
    "crates/krb5-tools",
    "crates/krb5-testkit",
    "examples/consumer",
    "examples/kdc-consumer",
    "examples/otp-kdc",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Aelieth/kerber-rust"
homepage = "https://github.com/Aelieth/kerber-rust"
authors = ["Aelieth"]
publish = false

[workspace.dependencies]
krb5-log = { path = "crates/krb5-log" }
krb5-cli = { path = "crates/krb5-cli" }
krb5-crypto = { path = "crates/krb5-crypto" }
krb5-types = { path = "crates/krb5-types" }
krb5-brainpool = { path = "crates/krb5-brainpool" }
krb5-asn1 = { path = "crates/krb5-asn1" }
krb5-protocol = { path = "crates/krb5-protocol" }
krb5-client = { path = "crates/krb5-client" }
krb5-kdc = { path = "crates/krb5-kdc" }
krb5-config = { path = "crates/krb5-config" }
krb5-gss = { path = "crates/krb5-gss" }
krb5-admin = { path = "crates/krb5-admin" }
krb5-testkit = { path = "crates/krb5-testkit" }
aes = { version = "0.9", features = ["zeroize"] }
# rasn's `OctetString` buffer; `try_into_mut` lets the last handle on a key, or on a secret copy
# made to be encoded (`safe_priv::wipe_octets`), wipe it in place.
bytes = "1.12"
camellia = { version = "0.2", features = ["zeroize"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock", "std"] }
# glibc LC_TIME tables. krb5-types formats dates with them; defmt stays off.
pure-rust-locales = { version = "0.8.2", default-features = false }
cmac = "0.8"
crypto-bigint = { version = "0.7", default-features = false, features = ["zeroize"] }
# SPAKE edwards25519 (MIT `edwards25519.c`). 5.0 shares cpufeatures 0.3 with the RustCrypto
# crates; 4.1 would add cpufeatures 0.2. No `alloc`: no multiscalar API is used.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["precomputed-tables", "zeroize"] }
des = { version = "0.9", features = ["zeroize"] }
getrandom = "0.2"
hmac = { version = "0.13", features = ["zeroize"] }
md-5 = { version = "0.11", features = ["zeroize"] }
md4 = { version = "0.11", features = ["zeroize"] }
nix = { version = "0.31", default-features = false, features = ["net", "uio", "user"] }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
signal-hook = { version = "0.3", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa"] }
p384 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa"] }
ecdsa = { version = "0.17", default-features = false, features = ["algorithm", "der"] }
p521 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa"] }
# No stable 0.14 yet: the release candidate, pinned exactly.
p224 = { version = "=0.14.0-rc.15", default-features = false, features = ["arithmetic", "ecdsa"] }
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa"] }
# brainpoolP256 and P384, r1 and t1, on their default fiat field; pinned exactly.
bp256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "sha256"] }
bp384 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "sha384"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
# Pinned: the build takes rasn from vendor/rasn (`[patch.crates-io]` below).
rasn = "=0.28.14"
rc4 = { version = "0.2", features = ["zeroize"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "meta", "unicode"] }
# The xattr reads of the SELinux labeler (`security.selinux`), behind a safe API.
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
sha1 = { version = "0.11", features = ["zeroize"] }
sha2 = { version = "0.11", features = ["zeroize"] }
subtle = "2.6"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# The defaults without `ansi`: the JSON log writes no colour, so a release daemon reads no `NO_COLOR`
# (MIT's read no such variable).
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter", "fmt", "json", "smallvec", "std", "tracing-log",
] }
zeroize = { version = "1.8", features = ["derive", "alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# P-384 compiles in only under p384's fiat backend (.cargo/config.toml sets it).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(p384_backend, values("fiat", "bigint"))'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# A one-line doc has no Errors or Panics section.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "deny"
unimplemented = "deny"
# The rasn Decode/Encode derives bind every field `_`-prefixed (314 sites in
# krb5-types alone), so this lint cannot be denied without an allow on each
# derived type.
no_effect_underscore_binding = "allow"
# clippy.toml names the infallible constructors. Stays allow: static callers
# still use them. consts is the allow module for a later raise.
disallowed_methods = "allow"
# Pedantic noise that is not useful in this tree: RFC vocabulary in
# rustdoc, MIT functions ported whole, MIT flag structs mirrored 1:1, and
# Kerberos names (cname/crealm, KAT single-letter vars).
doc_markdown = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
many_single_char_names = "allow"
# The cargo group: wildcard / negative / redundant feature and dependency
# names stay live. getrandom 0.2 (product) / 0.4 (rasn-derive-impl → uuid)
# and syn 2 / 3 in the proc-macro graph are the two known duplicates
# (deny.toml names the same two as its only skips); publish = false, so no
# keywords, categories, readme or documentation fields.
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

# W2-S1: the `test` job is link-bound (full debuginfo × ~190 binaries).
# line-tables-only keeps nextest backtraces; split-debuginfo keeps the
# linker from packing DWARF into every executable. [profile.test] inherits.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# M0: kdc nextest user 1319 s debug vs 115 s release. pbkdf2_hmac
# monomorphises into krb5-crypto (ops.rs). [profile.test] inherits.
[profile.dev.package.krb5-crypto]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.p384]
opt-level = 3
[profile.dev.package.p521]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3

# rasn 0.28.14 as published, with its BER decoder made to fail a message whose OPTIONAL
# explicit field, or SEQUENCE OF element, is present but does not decode (upstream ab9d0fd565,
# in rasn 0.29.0), and to decode as MIT 1.22.2 does. vendor/rasn/PATCHES.md has the diff and
# its provenance.
[patch.crates-io]
rasn = { path = "vendor/rasn" }
