# Per-push budgets (seconds) for the ci.yml jobs.
# A job that goes over its ceiling a second time in any five consecutive runs
# has that ceiling raised to the measured maximum plus about twenty percent.
# From runs 873-875 and the five successful jobs of run 876.
# Run 877 had no published durations when these numbers were set.
# Run 876 msrv failed and is not a sample.
# test 300 -> 360 (measured max 330). msrv 120 -> 150 (max 133).
# mit-smoke is new (max 119). run_wall stays 360 (max 333).

[jobs]
test = 360
doc = 90
# release is the old test step (max 108s) plus a toolchain. fuzz is the old
# doc step (max 61s) plus a toolchain. test and doc ceilings are unchanged.
release = 210
fuzz = 120
shellcheck = 150
msrv = 150
audit = 260
mit-smoke = 150

[push]
run_wall = 360
