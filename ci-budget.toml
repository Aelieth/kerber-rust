# W2-S6 per-push job budgets (seconds). Ratched from measured close-SHA
# CI (1069816 run 602: audit=249 mit-extra-2=211). Named Exit jobs stay
# test 300 / harness 270 / mit-extra 180 / run_wall 360. A run cannot
# measure itself; --check-budget compares a completed SHA / last N runs.

[jobs]
test = 300
harness = 270
harness-2 = 300
mit-extra = 180
mit-extra-2 = 220
doc = 90
msrv = 120
audit = 260
ledger-mit = 60
mit-image = 90
slo = 180
chaos = 180
soak = 240

[push]
run_wall = 360
