disallowed-methods = [
    { path = "krb5_types::PrincipalName::new", reason = "wire or ccache text uses try_new; static text uses krb5_types::consts" },
    { path = "krb5_types::PrincipalName::krbtgt", reason = "wire or ccache text uses try_new; static text uses krb5_types::consts::krbtgt" },
    { path = "krb5_types::ascii", reason = "wire or ccache text uses try_ascii; static text uses krb5_types::consts::ascii" },
    { path = "krb5_protocol::ccache::realm", reason = "wire or ccache text uses try_ascii; tests may call realm" },
    # CF-3, CF-4: a request never reads the profile or the environment. A program reads them once
    # at start (`bin/`, `ProfileSet::from_env_files`, `ClientContext::from_env`) and passes them down.
    { path = "krb5_config::load_krb5_conf", reason = "read the profile once at start (ProfileSet, ClientContext) and pass what a request needs" },
    { path = "krb5_config::load_krb5_conf_paths", reason = "read the profile once at start (ProfileSet, ClientContext) and pass what a request needs" },
    { path = "krb5_config::krb5_conf_paths", reason = "read the profile once at start (ProfileSet, ClientContext) and pass what a request needs" },
    { path = "krb5_config::init_profile", reason = "read the profile once at start (ProfileSet, ClientContext) and pass what a request needs" },
    { path = "krb5_config::init_kdc_profile", reason = "read the profile once at start (ProfileSet, ClientContext) and pass what a request needs" },
    { path = "krb5_config::kdc_conf_path", reason = "read the profile once at start (ProfileSet, ClientContext) and pass what a request needs" },
    { path = "krb5_config::env_kdc_config", reason = "read the profile once at start (ProfileSet, ClientContext) and pass what a request needs" },
    { path = "krb5_config::env_ktname", reason = "read the environment once at start and pass what a request needs" },
    { path = "krb5_config::Krb5Conf::load_file", reason = "read the profile once at start (ProfileSet, ClientContext) and pass what a request needs" },
    { path = "krb5_config::KdcConf::load_file", reason = "read the profile once at start (ProfileSet, ClientContext) and pass what a request needs" },
    { path = "krb5_config::KdcConf::load_file_for_realm", reason = "read the profile once at start (ProfileSet, ClientContext) and pass what a request needs" },
    { path = "krb5_config::KdcConf::load_file_without_realms", reason = "read the profile once at start (ProfileSet, ClientContext) and pass what a request needs" },
    { path = "krb5_config::KdcPaths::resolve", reason = "read the profile once at start (ProfileSet, ClientContext) and pass what a request needs" },
    { path = "krb5_config::LogSpecs::load", reason = "read the profile once at start and pass what a request needs" },
    { path = "krb5_config::LogSpecs::load_json", reason = "read the profile once at start and pass what a request needs" },
    { path = "krb5_config::IpropParams::load", reason = "read the profile once at start and pass what a request needs" },
    { path = "krb5_config::discover_kdc_in", reason = "read the profile once at start and pass what a request needs" },
    { path = "krb5_config::ProfileSet::from_env_files", reason = "a program reads its profile once, at start" },
    { path = "krb5_config::ClientContext::from_env", reason = "a program makes its context once, at start" },
    { path = "krb5_client::init_context", reason = "a program makes its context once, at start" },
    { path = "std::env::var", reason = "read the environment once at start and pass what a request needs" },
    { path = "std::env::var_os", reason = "read the environment once at start and pass what a request needs" },
    { path = "std::env::set_var", reason = "the environment is the process's; tests use the krb5-config test hooks" },
    # SS-1: a library returns its error; only a program's own start-up path ends the process.
    { path = "std::process::exit", reason = "library code returns its error; a program's main path may exit" },
]
