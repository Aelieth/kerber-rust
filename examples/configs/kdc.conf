# kdc.conf for krb5-kdc, krb5-kadmind and krb5-kdb: one realm, EXAMPLE.COM.
# Every key here is read by the Rust daemons; README.md names each key's
# reader, what is set through the environment instead, and what MIT reads that
# this port ignores. Point the daemons at this file with KRB5_KDC_PROFILE
# (otherwise they read /var/kerberos/krb5kdc/kdc.conf, as Fedora's MIT does).

[kdcdefaults]
    kdc_listen = 127.0.0.1:88

[realms]
    EXAMPLE.COM = {
        database_name = /var/lib/kerber-rust/principal
        key_stash_file = /var/lib/kerber-rust/.k5.EXAMPLE.COM
        acl_file = /etc/kerber-rust/kadm5.acl
        master_key_type = aes256-cts-hmac-sha1-96
        supported_enctypes = aes256-cts-hmac-sha1-96:normal aes128-cts-hmac-sha1-96:normal
        max_life = 10h 0m 0s
        max_renewable_life = 7d 0h 0m 0s
        default_principal_flags = +preauth
    }
