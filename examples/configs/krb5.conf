# krb5.conf for the EXAMPLE.COM realm, read by the Rust client tools
# (krb5-kinit, krb5-klist, krb5-kvno, ...) and usable by MIT clients unchanged.
# Every key here is parsed by the Rust client; README.md says which it uses.
# Point clients at this file with KRB5_CONFIG (otherwise /etc/krb5.conf).

[libdefaults]
    default_realm = EXAMPLE.COM
    dns_lookup_kdc = false
    dns_lookup_realm = false
    ticket_lifetime = 10h
    renew_lifetime = 7d
    forwardable = true
    rdns = false

[realms]
    EXAMPLE.COM = {
        kdc = kdc.example.com:88
        admin_server = kdc.example.com:749
    }

[domain_realm]
    .example.com = EXAMPLE.COM
    example.com = EXAMPLE.COM
